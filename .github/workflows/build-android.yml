name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Packages (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Sync Capacitor Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK (For Phone Testing)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build Play Store Bundle AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon || ./gradlew bundleDebug --no-daemon

      - name: Upload Testing APK
        uses: actions/upload-artifact@v4
        with:
          name: CaratteriSpeciali-Testing-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: CaratteriSpeciali-PlayStore-AAB
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: warn
